interface:
  display_name: "Ozon Product Media Generator"
  short_description: "Generate verified Ozon product media"
  default_prompt: "Use $ozon-product-media-generator for only RUN package_id=<id> worker_id=<id>. Before generation run media-preflight and require the user-configured public R2 channel; release the package without generating if it is unavailable. Treat locked 1688 SKU and subject evidence as authoritative. Load the fixed ozon-commercial-infographic-core-prompt.txt byte-for-byte. Keep the white-background image only as the locked subject anchor, then generate the fixed 2+3+3 structure: one 1x2 main grid and two 1x3 supporting grids, producing exactly eight 3:4 commercial infographics. When Ozon references are absent or insufficient, continue with ozon_aesthetic_fallback. Render the exact verified Russian headline, subtitle, and 2-4 functional labels in the first scene call. Build slideshow.mp4 and video_cover.jpg locally, publish all media through R2, perform direct Ozon gallery replacement, submit the Ozon video fields, and complete without returning files to the workbench."
