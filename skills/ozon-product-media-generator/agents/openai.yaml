interface:
  display_name: "Ozon Product Media Generator"
  short_description: "Generate verified Ozon product media"
  default_prompt: "Use $ozon-product-media-generator for only RUN package_id=<id> worker_id=<id>. Before generation run media-preflight and require the user-configured public R2 channel; release the package without generating if it is unavailable. Treat locked 1688 SKU and subject evidence as authoritative. Load the fixed commercial prompt byte-for-byte. Generate and freeze one white-background subject anchor, then use that exact file as the only image input and Reference Image 1 for every finished-grid and repair call; never attach Ozon images or any second image. Generate the fixed 2+3+3 structure: one 1x2 main grid and two 1x3 supporting grids, producing exactly eight 3:4 commercial infographics with first-pass verified Russian copy. Build slideshow.mp4 and video_cover.jpg locally, publish all media through R2, replace the Ozon gallery, submit the video fields, and complete without returning files to the workbench."
