interface:
  display_name: "Ozon Image Generation Controller"
  short_description: "Coordinate ten fixed reusable visible image tasks"
  default_prompt: "Use $ozon-image-generation-controller and scripts/ozon_image_task_inbox.py to coordinate ten fixed reusable user-visible Codex tasks. Reuse the registered tasks in slot order, send only claimed RUN package_id commands, recycle each idle slot immediately, and continue until pending=0 and in_progress=0. Never create product-specific tasks; replace a registered task only when the user explicitly requests a new task. Each worker performs direct Ozon gallery replacement and never returns generated images to the workbench."
