interface:
  display_name: "Ozon Image Generation Controller"
  short_description: "Coordinate ten fixed reusable visible image tasks"
  default_prompt: "Use $ozon-image-generation-controller and scripts/ozon_image_task_inbox.py to coordinate ten fixed reusable user-visible Codex tasks. Run media-preflight before claiming any package and stop before generation until the user has configured a valid public R2 channel. If the fixed-task registry is empty on first use, treat the user's direct request to start or continue image work as one-time pool-bootstrap authorization: create and durably register only the missing fixed slots. Otherwise reuse the registered tasks in slot order, send only the short claimed RUN package_id=<id> worker_id=<id> command, recycle each idle slot, and continue until pending=0 and in_progress=0. Never send product-specific prompt bodies from the controller and never create product-specific tasks; the worker must load the fixed commercial-infographic core and 2+3+3 wrappers from $ozon-product-media-generator. Replace an already registered task only when the user explicitly requests a new task. Each worker publishes eight 3:4 images, a slideshow video, and its cover, then updates the same Ozon product without returning files to the workbench."
